name: validate-secrets
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-secrets-and-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required backend secrets
        run: |
          [ -n "${{ secrets.AWS_BACKEND_ROLE_ARN }}" ] || { echo "Missing AWS_BACKEND_ROLE_ARN"; exit 1; }
          [ -n "${{ secrets.ECR_API_REPO }}" ] || { echo "Missing ECR_API_REPO"; exit 1; }
          [ -n "${{ secrets.ECS_CLUSTER }}" ] || { echo "Missing ECS_CLUSTER"; exit 1; }
          [ -n "${{ secrets.ECS_SERVICE }}" ] || { echo "Missing ECS_SERVICE"; exit 1; }

      - name: Verify required frontend secrets
        run: |
          [ -n "${{ secrets.AWS_FRONTEND_ROLE_ARN }}" ] || { echo "Missing AWS_FRONTEND_ROLE_ARN"; exit 1; }
          [ -n "${{ secrets.S3_STAGING_BUCKET }}" ] || { echo "Missing S3_STAGING_BUCKET"; exit 1; }
          [ -n "${{ secrets.S3_PRODUCTION_BUCKET }}" ] || { echo "Missing S3_PRODUCTION_BUCKET"; exit 1; }

      - name: Verify optional CloudFront secrets (skipped if empty)
        run: |
          echo "CF_STAGING_DISTRIBUTION set? $([ -n \"${{ secrets.CF_STAGING_DISTRIBUTION }}\" ] && echo yes || echo no)" > /dev/null
          echo "CF_PRODUCTION_DISTRIBUTION set? $([ -n \"${{ secrets.CF_PRODUCTION_DISTRIBUTION }}\" ] && echo yes || echo no)" > /dev/null

      - name: Assume backend AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm AWS identity (backend)
        run: aws sts get-caller-identity

      - name: Assume frontend AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm AWS identity (frontend)
        run: aws sts get-caller-identity